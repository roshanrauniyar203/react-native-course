<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week3 - jQuery Animation</title>
    <link rel="stylesheet" href="classwork.css" />
  </head>
  <body>
    <div class="container">
      <h1>Classwork</h1>

      <div class="countries" id="mainBox">
        <div class="country" id="country1">
          <h2>Nepal</h2>
          <p>Land of the Himalayas and beautiful culture.</p>
        </div>

        <div class="country" id="country2">
          <h2>Japan</h2>
          <p>Land of technology, sushi, and tradition.</p>
        </div>
      </div>

      <div class="btn-group">
        <button id="hideBtn">Hide</button>
        <button id="showBtn">Show</button>
        <button id="fadeBtn">Fade</button>
        <button id="slideBtn">Slide</button>
        <button id="animateBtn">Animate</button>
        <button id="stopBtn">Stop</button>
        <button id="toggleBtn">Toggle</button>
        <button id="chainBtn">Chaining Effect</button>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="classwork.js"></script>
  </body>
</html>
